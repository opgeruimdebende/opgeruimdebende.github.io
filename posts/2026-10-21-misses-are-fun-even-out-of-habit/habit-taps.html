<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Habit taps</title>
<style>
  :root { --bg:#ECEAE5; --ink:#24252B; --muted:#6A675F; --token:#FFFFFF; --edge:#ADA89E; --accent:#B23A0C; --accent-edge:#7C2806; --on-accent:#FFFFFF; --lit:#E2541C; }
  @media (prefers-color-scheme: dark) { :root { --bg:#2A2B30; --ink:#F1EFEA; --muted:#A3A19B; --token:#16171A; --edge:#050506; --accent:#F06A33; --accent-edge:#9A3209; --on-accent:#16171A; --lit:#F06A33; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { padding: 14px 16px 16px; display: grid; gap: 14px; }
  .top { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }
  .seg { display: inline-flex; background: color-mix(in srgb, var(--edge) 30%, transparent); border-radius: 12px; padding: 3px; }
  .seg button { font: inherit; font-weight: 700; border: 0; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 9px; cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--token); color: var(--ink); box-shadow: 0 2px 0 var(--edge); }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn { font: inherit; font-weight: 800; font-size: 17px; border: 0; border-radius: 12px; padding: 12px 22px; background: var(--token); color: var(--ink); box-shadow: 0 4px 0 var(--edge); cursor: pointer; }
  .btn.go { background: var(--accent); color: var(--on-accent); box-shadow: 0 4px 0 var(--accent-edge); }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--edge); }
  .btn.go:active { box-shadow: 0 0 0 var(--accent-edge); }
  .dots { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: clamp(2px, 1vw, 6px); }
  .dot { aspect-ratio: 1; border-radius: 50%; background: color-mix(in srgb, var(--edge) 45%, transparent); transition: background .06s; }
  .dot.lit { background: var(--lit); }
  button:focus-visible { outline: 3px solid var(--lit); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .dot { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="seg" role="group" aria-label="Takes">
      <button id="four" type="button" aria-pressed="true">Four takes</button>
      <button id="one" type="button" aria-pressed="false">One take</button>
    </div>
    <p class="hint">Sixteen misses, a tenth of a second apart.</p>
  </div>
  <div class="btns">
    <button class="btn" id="tap" type="button">Tap</button>
    <button class="btn go" id="habit" type="button">Habit taps</button>
  </div>
  <div class="dots" id="dots" aria-hidden="true"></div>
</main>

  document.getElementById('habit').addEventListener('click', function () {
    start().then(function () {
      clearTimers();
      for (var n = 0; n < COUNT; n++) { miss(n * GAP / 1000); flash(n, n * GAP); }
    });
  });
  function pick(t) {
    takes = t; turn = 0;
    document.getElementById('four').setAttribute('aria-pressed', String(t === 4));
    document.getElementById('one').setAttribute('aria-pressed', String(t === 1));
  }
  document.getElementById('four').addEventListener('click', function () { pick(4); });
  document.getElementById('one').addEventListener('click', function () { pick(1); });
})();
</script>
</body>
