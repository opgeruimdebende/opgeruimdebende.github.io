#status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(var(--page-top), var(--page-bottom)); z-index: 1; transition: opacity 300ms ease; }
#status.done { opacity: 0; pointer-events: none; }
.col { display: flex; flex-direction: column; align-items: center; width: min(320px, calc(100vw - 32px)); }
.wordmark { width: 168px; height: auto; display: block; }
/* Phone (under 960 px wide, as Klaar!): the wordmark at the size and place of the home screen's
   (60 pt, cap top 85 px; 45 px when the home screen runs out of height, see fitTight below), so it stays put when the game appears.
   Measured on Klaar!'s home screen at commit 117163c+; if that layout changes, change these numbers. */
@media (max-width: 959.98px) {
  #status { justify-content: flex-start; }
  .col { flex: 1; width: min(337px, calc(100vw - 56px)); }
  .wordmark { width: 224.12px; margin-top: 84px; flex: none; }
  .below { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; width: 100%; }
  /* the board's top edge 99 px under the wordmark's cap top, where the home screen's mini board sits */
  .below #demo { margin-top: 19.13px; }
}
@media (max-width: 959.98px) { #status.tight .wordmark { margin-top: 44px; } }
.below { display: flex; flex-direction: column; align-items: center; width: 100%; }
#demo { margin-top: 44px; display: block; overflow: visible; }
.caption b { font-family: "KlaarDigits", "KlaarText", system-ui, sans-serif; font-weight: 700; color: var(--ink); }
.caption { margin-top: 18px; font-size: 16px; line-height: 22px; color: var(--muted); text-align: center; }
.progress { margin-top: 26px; width: 100%; max-width: 200px; }
.track { height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--calm); border-radius: 2px; transition: width 160ms linear; }
.fill.unknown { width: 30%; animation: sweep 1.4s ease-in-out infinite; }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
.amount { margin-top: 8px; font-size: 12px; line-height: 16px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; min-height: 16px; }
.notice { display: none; margin-top: 32px; width: 100%; box-sizing: border-box; background: var(--surface); border-radius: 16px;
  padding: 14px 16px 16px; text-align: left; box-shadow: 0 0 0 1px var(--rule); }
.notice h1 { margin: 0 0 6px; font-size: 20px; line-height: 26px; font-weight: 500; }
.notice p { margin: 0 0 6px; font-size: 14px; line-height: 20px; color: var(--muted); white-space: pre-line; }
.notice button { margin-top: 10px; font: inherit; font-size: 16px; color: var(--btn-label); background: var(--btn); border: 0;
  border-radius: 12px; padding: 10px 18px; box-shadow: 0 3px 0 var(--btn-edge); cursor: pointer; }
.notice button:active { transform: translateY(1.5px); box-shadow: 0 1.5px 0 var(--btn-edge); }
#status.failed .caption, #status.failed .progress, #status.failed #demo { display: none; }
#status.failed .notice { display: block; }

<script>
/* ---- Every value of the demo in one place (from klaar_tokens.gd, Platinum, Wa) ---- */
const P = {
  // Three boards, one per target. Each clears completely: after the demo's 2 x 2, the eight
  // tokens left clear in three more moves. order: 'random' starts on a random board and then
  // takes the next in turn, so every visit can open on a different target; 'sequence' always
  // starts on the first.
  boards: [
    { target: 12, digits: [[5, 2, 4, 9], [6, 1, 5, 3], [1, 1, 3, 8]] },
    { target: 15, digits: [[8, 3, 4, 1], [7, 2, 6, 5], [9, 5, 6, 4]] },
    { target: 10, digits: [[2, 1, 2, 4], [4, 3, 4, 6], [5, 1, 1, 7]] }
  ],
  order: 'random',
  cols: 4, rows: 3,
  drag: [[1, 0], [2, 0], [1, 1], [2, 1]],  // the 2 x 2 the finger covers: right first, then down
  pitch: 44,                 // token pitch, points
  gapRatio: 0.12, gapMin: 5, // gap = max(5, 12% of pitch)
  radiusRatio: 0.26, edgeRatio: 0.07, edgeMin: 2,
  digitRatio: 0.70,
  selRadius: 10, outlineSelecting: 2.5, outlineExact: 4, fillSelecting: 0.12, fillExact: 0.16,
  tagHeight: 24, tagMinWidth: 36, tagPadding: 6, tagRadius: 8, tagEdge: 2, tagFont: 16, tagFontExact: 18, tagOffset: 8,
  sinkRatio: 0.5, clearScale: 0.2, footprint: 0.12,
  ms: {
    start: 400,        // first board at rest before the finger arrives
    next: 200,         // the same pause on every later board (the fade-in already gives a beat)
    press: 120,        // the rectangle appears under the finger
    drag: 1250,        // one continuous drag: across to the second token, curving down over the next two
    exactHold: 520,    // finger still down on the exact match
    sink: 260,         // clear_ms: covered tokens sink, cleared tokens shrink and fade
    tagHold: 400, tagFade: 500,   // a little shorter than the game's 500 + 600, so the cleared board lingers less
    rest: 250,         // footprints alone on the board before the next one
    swap: 300,         // the next board's tokens fade in (REDUCED_FADE_IN_MS)
  },
  ease: [0.25, 0.1, 0.25, 1.0],
  dragEase: [0.45, 0.05, 0.4, 1.0],   // a hand: slow start, steady middle, settles at the end
  colours: { board: '#CFCBC2', token: '#FFFFFF', tokenEdge: '#ADA89E', digit: '#24252B',
    calmFill: '#17706F', onCalm: '#FFFFFF', accent: '#E2541C', accentLine: '#B23A0C', accentEdge: '#9A3209', onAccent: '#FFFFFF' },

(function demo() {
  const svg = document.getElementById('demo'), NS = 'http://www.w3.org/2000/svg';
  const captionTarget = document.getElementById('caption-target');
  const C = P.colours, gap = Math.max(P.gapMin, P.pitch * P.gapRatio), S = P.pitch - gap;
  const edge = Math.max(P.edgeMin, S * P.edgeRatio), r = S * P.radiusRatio, pad = 2 * gap;
  const W = P.cols * P.pitch + 4 * gap, H = P.rows * P.pitch + 4 * gap, top = P.tagHeight + P.tagOffset;
  svg.setAttribute('width', W); svg.setAttribute('height', H + top); svg.setAttribute('viewBox', `0 ${-top} ${W} ${H + top}`);
  const el = (n, a, parent = svg) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); parent.appendChild(e); return e; };
  const mix = (a, b, t) => { const p = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)); const x = p(a), y = p(b);
    return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
  el('rect', { x: 0, y: 0, width: W, height: H, rx: r + pad, fill: C.board });
  const feet = [], tokens = [];
  for (let rw = 0; rw < P.rows; rw++) for (let c = 0; c < P.cols; c++) {
    const x = pad + c * P.pitch, y = pad + rw * P.pitch;
    const f = el('rect', { x, y, width: S, height: S, rx: r, fill: mix(C.board, C.token, P.footprint), opacity: 0 });
    const g = el('g', {});
    const side = el('rect', { x, y, width: S, height: S + edge, rx: r, fill: C.tokenEdge }, g);
    el('rect', { x, y, width: S, height: S, rx: r, fill: C.token }, g);
    const t = el('text', { x: x + S / 2, y: y + S / 2, 'text-anchor': 'middle', 'dominant-baseline': 'central',
      'font-family': 'KlaarDigits, sans-serif', 'font-weight': 700, 'font-size': S * P.digitRatio, fill: C.digit }, g);
    feet.push(f); tokens.push({ c, rw, x, y, g, side, t, sink: 0, dragged: P.drag.some(([dc, dr]) => dc === c && dr === rw) });

  const tagFace = el('rect', { rx: P.tagRadius, height: P.tagHeight }, tag);
  const tagText = el('text', { 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-family': 'KlaarDigits, sans-serif', 'font-weight': 700 }, tag);

  const bez = (x1, y1, x2, y2) => t => { if (t <= 0) return 0; if (t >= 1) return 1; let lo = 0, hi = 1, m;
    for (let i = 0; i < 24; i++) { m = (lo + hi) / 2; const x = 3 * (1 - m) * (1 - m) * m * x1 + 3 * (1 - m) * m * m * x2 + m * m * m; if (x < t) lo = m; else hi = m; }

  const E = bez(...P.ease), D = bez(...P.dragEase), lerp = (a, b, t) => a + (b - a) * t, clamp = t => Math.max(0, Math.min(1, t));

  // smooth curve (Catmull-Rom through three points): just past the first token, along the row past
  // the second, then down past the bottom row of the 2 x 2. The rectangle runs from press to corner.

  const c1 = Math.max(...P.drag.map(d => d[0])), r1 = Math.max(...P.drag.map(d => d[1]));
  const press = [pad + c0 * P.pitch - gap / 2, pad + r0 * P.pitch - gap / 2];
  const endPt = [pad + (c1 + 1) * P.pitch - gap / 2, pad + (r1 + 1) * P.pitch - gap / 2 + edge * 0.5];
  const way = [press, [pad + c0 * P.pitch + S * 0.72, pad + r0 * P.pitch + S * 0.78],
    [endPt[0] - gap * 0.2, pad + r0 * P.pitch + S + edge * 0.5], endPt];
  const cr = (p0, p1, p2, p3, t) => { const t2 = t * t, t3 = t2 * t;
    return [0, 1].map(i => 0.5 * (2 * p1[i] + (-p0[i] + p2[i]) * t + (2 * p0[i] - 5 * p1[i] + 4 * p2[i] - p3[i]) * t2 + (-p0[i] + 3 * p1[i] - 3 * p2[i] + p3[i]) * t3)); };

  const pts = [way[0], ...way, way[way.length - 1]], N = 240, samples = [], lens = [0];
  for (let i = 0; i <= N; i++) { const u = i / N * (way.length - 1), k = Math.min(Math.floor(u), way.length - 2);

    const a = lens[i - 1], b = lens[i], u = b > a ? (want - a) / (b - a) : 0; return [lerp(samples[i - 1][0], samples[i][0], u), lerp(samples[i - 1][1], samples[i][1], u)]; };

  const m = P.ms;
  let lead, dragStart, release, restEnd, loop;   // one round's timeline; the first round waits longer
  const plan = first => { lead = first ? m.start : m.next; dragStart = lead + m.press; release = dragStart + m.drag + m.exactHold;
    restEnd = release + Math.max(m.sink, m.tagHold + m.tagFade) + m.rest; loop = restEnd + m.swap; };
  plan(true);
  window.klaarRound = () => ({ first: m.start + m.press + m.drag + m.exactHold + Math.max(m.sink, m.tagHold + m.tagFade) + m.rest + m.swap,
    later: m.next + m.press + m.drag + m.exactHold + Math.max(m.sink, m.tagHold + m.tagFade) + m.rest + m.swap });
  let board = 0;
  function load(i) { board = i; const b = P.boards[i];
    tokens.forEach(o => { o.t.textContent = b.digits[o.rw][o.c]; o.sink = 0; });
    captionTarget.textContent = b.target; }

  function frame(now, dt) {
    const b = P.boards[board];

      sel.setAttribute('x', box[0] + w / 2); sel.setAttribute('y', box[1] + w / 2);
      sel.setAttribute('width', Math.max(0, box[2] - box[0] - w)); sel.setAttribute('height', Math.max(0, box[3] - box[1] - w));
      sel.setAttribute('rx', Math.max(0, P.selRadius - w / 2)); sel.setAttribute('stroke', col); sel.setAttribute('stroke-width', w);
      sel.setAttribute('fill', exact ? C.accent : C.calmFill); sel.setAttribute('fill-opacity', exact ? P.fillExact : P.fillSelecting);
      sel.setAttribute('opacity', E(clamp((now - lead) / m.press)));

    if ((box && sum > 0) || (now >= release && now < release + m.tagHold + m.tagFade)) {
      if (box) { frame.lastBox = box; frame.lastSum = sum; }
      const bx = frame.lastBox, sm = frame.lastSum, ex = sm === b.target;
      const fs = ex ? P.tagFontExact : P.tagFont, tw = Math.max(P.tagMinWidth, fs * 0.62 * String(sm).length + 2 * P.tagPadding);
      const cx = Math.max(tw / 2, Math.min(W - tw / 2, (bx[0] + bx[2]) / 2)), ty = bx[1] - P.tagOffset - P.tagHeight;
      tagEdge.setAttribute('x', cx - tw / 2); tagEdge.setAttribute('y', ty + P.tagEdge); tagEdge.setAttribute('width', tw);
      tagFace.setAttribute('x', cx - tw / 2); tagFace.setAttribute('y', ty); tagFace.setAttribute('width', tw);
      tagEdge.setAttribute('fill', ex ? C.accentEdge : mix(C.calmFill, '#000000', 0.4)); tagFace.setAttribute('fill', ex ? C.accent : C.calmFill);
      tagText.setAttribute('x', cx); tagText.setAttribute('y', ty + P.tagHeight / 2 + 1); tagText.setAttribute('font-size', fs);
      tagText.setAttribute('fill', ex ? C.onAccent : C.onCalm); tagText.textContent = sm;

        const v = E(clamp((now - restEnd) / m.swap)); scale = 1; dy = 0; o.sink = 0;
        alpha = v; foot = o.dragged ? 1 - v : 0;

  window.klaarDemo = { stopped: false };

    if (now >= loop) { t0 = ts; now = 0; swapped = false; plan(false); }

/* ---- The home screen's short-screen layout (cap top 45 instead of 85): measured on Klaar!'s own
   home screen, it switches below a height of about 777 px at 320 px wide, rising 0.38 px per px of
   width to 812 px. ---- */
(function fitTight() {
  const status = document.getElementById('status');
  const fit = () => status && status.classList.toggle('tight', window.innerHeight < Math.min(812, 777 + (window.innerWidth - 320) * 0.38));
  fit(); window.addEventListener('resize', fit);
})();

/* ---- Keep Klaar!'s favicons: once running, the engine adds its own window icon (Godot's robot, as link
   #-gd-engine-icon) as the tab icon. Remove that link whenever it appears. ---- */
(function () {
  const drop = () => { const l = document.getElementById('-gd-engine-icon'); if (l) l.remove(); };
  new MutationObserver(drop).observe(document.head, { childList: true, subtree: true, attributes: true, attributeFilter: ['href', 'id'] });
  drop();
})();

/* ---- Progress, the error state and the hand-over to the game ---- */
const KlaarStatus = (function () {
  const status = document.getElementById('status'), fill = document.getElementById('fill'), amount = document.getElementById('amount');
  const mb = n => (n / 1048576).toFixed(n < 10485760 ? 1 : 0);
  document.getElementById('retry').addEventListener('click', () => window.location.reload());
  return {
    progress(current, total) {
      if (current > 0 && total > 0) {
        fill.classList.remove('unknown'); fill.style.width = (100 * current / total).toFixed(1) + '%';
        amount.textContent = current >= total ? 'Starting' : `Loading ${mb(current)} of ${mb(total)} MB`;
      } else { fill.classList.add('unknown'); fill.style.width = ''; amount.textContent = 'Loading'; }
    },
    fail(title, text) {
      document.getElementById('notice-title').textContent = title;
      document.getElementById('notice-text').textContent = text;
      status.classList.add('failed'); window.klaarDemo.stopped = true;
    },
    done() { window.klaarDemo.stopped = true; status.classList.add('done'); setTimeout(() => status.remove(), 320); },
  };
})();
/* Godot's own start-up, as in its default shell (Godot 4.7), with the status calls pointed at KlaarStatus. */
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":755380,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
(function () {
  let initializing = true;
  function failure(err) {
    console.error(err);
    const text = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'Something went wrong while starting.');
    KlaarStatus.fail("Klaar! can't start here", text);
    initializing = false;

  if (missing.length !== 0) {
    if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
      let reg;
      try { reg = navigator.serviceWorker.getRegistration(); } catch (err) { reg = Promise.reject(new Error('Service worker registration failed.')); }

        reg.then((r) => (r != null ? Promise.reject(new Error('Service worker already exists.')) : r)).then(() => engine.installServiceWorker()),
        new Promise((resolve) => { setTimeout(() => resolve(), 2000); }),
      ]).then(() => { window.location.reload(); }).catch((err) => { console.error('Error while registering service worker:', err); });

        'Missing: ' + missing.join(', ') + '.\nA recent Chrome, Edge, Firefox or Safari has everything it needs.');
    }

    engine.startGame({ onProgress: (current, total) => KlaarStatus.progress(current, total) })
      .then(() => { if (initializing) KlaarStatus.done(); }, failure);
  }
}());
