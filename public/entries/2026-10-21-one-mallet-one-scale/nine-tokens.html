<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nine tokens, nine notes</title>
<style>
  :root { --bg:#ECEAE5; --ink:#24252B; --muted:#6A675F; --token:#FFFFFF; --edge:#ADA89E; --accent:#B23A0C; --accent-edge:#7C2806; --on-accent:#FFFFFF; --lit:#E2541C; }
  @media (prefers-color-scheme: dark) { :root { --bg:#2A2B30; --ink:#F1EFEA; --muted:#A3A19B; --token:#16171A; --edge:#050506; --accent:#F06A33; --accent-edge:#9A3209; --on-accent:#16171A; --lit:#F06A33; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { padding: 14px 16px 16px; display: grid; gap: 14px; }
  .top { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }
  .seg { display: inline-flex; background: color-mix(in srgb, var(--edge) 30%, transparent); border-radius: 12px; padding: 3px; }
  .seg button { font: inherit; font-weight: 700; border: 0; background: transparent; color: var(--muted); padding: 6px 16px; border-radius: 9px; cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--token); color: var(--ink); box-shadow: 0 2px 0 var(--edge); }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }
  .row { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: clamp(3px, 1.4vw, 8px); }
  .tok { aspect-ratio: 1; min-width: 0; border: 0; border-radius: 26%; background: var(--token); color: var(--ink); font: 800 clamp(16px, 5vw, 28px)/1 system-ui, sans-serif;
    box-shadow: 0 4px 0 var(--edge); cursor: pointer; padding: 0; transition: transform .06s, box-shadow .06s, background .12s; }
  .tok:active, .tok.lit { transform: translateY(4px); box-shadow: 0 0 0 var(--edge); }
  .tok.lit { background: var(--lit); color: #fff; }
  .go { justify-self: start; font: inherit; font-weight: 800; font-size: 17px; border: 0; border-radius: 12px; padding: 10px 22px; background: var(--accent); color: var(--on-accent);
    box-shadow: 0 4px 0 var(--accent-edge); cursor: pointer; }
  .go:active { transform: translateY(4px); box-shadow: 0 0 0 var(--accent-edge); }
  button:focus-visible { outline: 3px solid var(--lit); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .tok { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="seg" role="group" aria-label="Voice">
      <button id="wa" type="button" aria-pressed="true">Wa</button>
      <button id="hap" type="button" aria-pressed="false">Hap</button>
    </div>
    <p class="hint">Tap a token to hear its note.</p>
  </div>
  <div class="row" id="row"></div>
  <button class="go" id="go" type="button">Klaar!</button>
</main>
