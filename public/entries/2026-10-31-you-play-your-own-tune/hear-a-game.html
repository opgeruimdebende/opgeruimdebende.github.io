<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hear a game</title>
<style>
  :root { --bg:#ECEAE5; --ink:#24252B; --muted:#6A675F; --token:#FFFFFF; --edge:#ADA89E; --accent:#B23A0C; --accent-edge:#7C2806; --on-accent:#FFFFFF; --lit:#E2541C; --rule:#D6D2CA; --dot-edge:#ADA89E; }
  @media (prefers-color-scheme: dark) { :root { --bg:#2A2B30; --ink:#F1EFEA; --muted:#A3A19B; --token:#16171A; --edge:#050506; --accent:#F06A33; --accent-edge:#9A3209; --on-accent:#16171A; --lit:#F06A33; --rule:#3A3B41; --dot-edge:#8A877F; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { padding: 14px 16px 16px; display: grid; gap: 12px; }
  .top { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }
  .seg { display: inline-flex; background: color-mix(in srgb, var(--edge) 30%, transparent); border-radius: 12px; padding: 3px; }
  .seg button { font: inherit; font-weight: 700; border: 0; background: transparent; color: var(--muted); padding: 6px 16px; border-radius: 9px; cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--token); color: var(--ink); box-shadow: 0 2px 0 var(--edge); }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }
  .small { font-size: 12px; }
  svg { display: block; width: 100%; height: 150px; overflow: visible; }
  .base { stroke: var(--rule); stroke-width: 1; }
  .head { stroke: var(--accent); stroke-width: 1.5; opacity: .55; }
  .n { fill: var(--token); stroke: var(--dot-edge); stroke-width: 1.5; }
  .e { fill: var(--accent); }
  .o { fill: none; stroke: var(--accent); stroke-width: 2; }
  .m { stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
  .tag { fill: var(--accent); font: 800 14px system-ui, sans-serif; }
  .tag.dot { opacity: 0; }
  .tag.dot.on { opacity: 1; }
  .dot { opacity: .2; transform-box: fill-box; transform-origin: center; }
  .dot.on { opacity: 1; animation: pop .22s ease-out; }
  @keyframes pop { from { transform: scale(1.8); } to { transform: scale(1); } }
  .go { justify-self: start; font: inherit; font-weight: 800; border: 0; border-radius: 12px; padding: 9px 22px; background: var(--accent); color: var(--on-accent);
    box-shadow: 0 4px 0 var(--accent-edge); cursor: pointer; }
  .go:active { transform: translateY(4px); box-shadow: 0 0 0 var(--accent-edge); }
  button:focus-visible { outline: 3px solid var(--lit); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .dot.on { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="seg" role="group" aria-label="Game">
      <button id="b-wa" type="button" aria-pressed="true">Wa</button>

    <p class="hint" id="line"></p>

  <svg id="strip" viewBox="0 0 600 150" role="img" aria-label="Each clear as a dot: later to the right, higher notes higher up"></svg>
  <div class="top"><button class="go" id="go" type="button">Play</button><p class="hint" id="msg" role="status"></p></div>
  <p class="hint small">Each dot is one clear; higher dots are higher notes, ticks along the line are misses. Audio © 2026 Bron van Doen V.O.F., all rights reserved.</p>
</main>
