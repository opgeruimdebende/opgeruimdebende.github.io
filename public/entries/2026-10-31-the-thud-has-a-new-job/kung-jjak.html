<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kung-jjak</title>
<style>
  :root { --bg:#ECEAE5; --ink:#24252B; --muted:#6A675F; --token:#FFFFFF; --edge:#ADA89E; --accent:#B23A0C; --accent-edge:#7C2806; --on-accent:#FFFFFF; --lit:#E2541C; }
  @media (prefers-color-scheme: dark) { :root { --bg:#2A2B30; --ink:#F1EFEA; --muted:#A3A19B; --token:#16171A; --edge:#050506; --accent:#F06A33; --accent-edge:#9A3209; --on-accent:#16171A; --lit:#F06A33; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { padding: 14px 16px 16px; display: grid; gap: 14px; }
  .score { display: grid; gap: 6px; justify-content: start; }
  .bar { display: grid; grid-template-columns: repeat(5, 1.35em) auto; column-gap: clamp(4px, 2vw, 14px); align-items: baseline; font: 800 clamp(26px, 8vw, 40px)/1.15 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  .s { color: color-mix(in srgb, var(--ink) 30%, transparent); transition: color .08s, transform .08s; display: inline-block; }
  .s.jjak { font-size: .82em; }
  .s.pick { font-size: .7em; }
  .s.lit { color: var(--lit); transform: translateY(-3px); }
  .pipe { color: color-mix(in srgb, var(--ink) 25%, transparent); font-weight: 400; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .go { font: inherit; font-weight: 800; border: 0; border-radius: 12px; padding: 9px 22px; background: var(--accent); color: var(--on-accent);
    box-shadow: 0 4px 0 var(--accent-edge); cursor: pointer; }
  .go:active { transform: translateY(4px); box-shadow: 0 0 0 var(--accent-edge); }
  .tok { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 9px 14px; background: var(--token); color: var(--ink);
    box-shadow: 0 4px 0 var(--edge); cursor: pointer; }
  .tok:active { transform: translateY(4px); box-shadow: 0 0 0 var(--edge); }
  button:focus-visible { outline: 3px solid var(--lit); outline-offset: 2px; }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }
  .small { font-size: 12px; }
  @media (prefers-reduced-motion: reduce) { .s, .s.lit { transition: none; transform: none; } }
</style>
</head>
<body>
<main>
  <div class="score" id="score" aria-hidden="true"></div>
  <div class="row">
    <button class="go" id="go" type="button">Play the beat</button>
    <p class="hint" id="msg" role="status"></p>
  </div>
  <div class="row">
    <button class="tok" id="old" type="button">Old miss: the thud</button>
    <button class="tok" id="new" type="button">New miss: muted mallet</button>
  </div>
  <p class="hint small">Hap's beat at 128 beats per minute: a low thud (쿵) on one and three, a dry wooden snap (짝) on two and four, and a pickup every other bar. Tap the misses quickly to hear them as a habit. Audio © 2026 Bron van Doen V.O.F., all rights reserved.</p>
</main>

  var BEAT = 60 / 128, BAR = 4 * BEAT, BARS = 8;
  // The owner's notation: the pickup bar first, then the plain bar.
  var LINES = [[['쿵', 0], ['짝', 1], ['쿵', 2], ['짝', 3], ['쿵', 3.5, 'pick']], [['쿵', 0], ['짝', 1], ['쿵', 2], ['짝', 3]]];
  var score = document.getElementById('score'), go = document.getElementById('go'), msg = document.getElementById('msg');
  var spans = [];
  LINES.forEach(function (line, li) {
    var bar = document.createElement('div'); bar.className = 'bar';
    line.forEach(function (n) {
      var s = document.createElement('span'); s.textContent = n[0];
      s.className = 's' + (n[0] === '짝' ? ' jjak' : '') + (n[2] ? ' pick' : '');
      bar.appendChild(s); spans.push({ el: s, line: li, beat: n[1] });
    });
    if (line.length < 5) bar.appendChild(document.createElement('span'));
    var p = document.createElement('span'); p.className = 'pipe'; p.textContent = '|'; bar.appendChild(p);
    score.appendChild(bar);
  });
  // Every stroke in the 8 bars: bar b uses line b % 2.
  var hits = [];
  for (var b = 0; b < BARS; b++) spans.forEach(function (sp) { if (sp.line === b % 2) hits.push({ t: b * BAR + sp.beat * BEAT, sp: sp }); });

  var ctx = null, buf = {}, src = null, t0 = 0, playing = false, raf = 0, thud = 0, muted = 0;
  function decode(k) {
    if (buf[k]) return Promise.resolve(buf[k]);
    var bin = atob(SOUNDS[k]), bytes = new Uint8Array(bin.length);
    for (var j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
    return new Promise(function (ok, no) { ctx.decodeAudioData(bytes.buffer, function (d) { buf[k] = d; ok(d); }, no); });
  }
  function ready() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    return Promise.all(Object.keys(SOUNDS).map(decode)).then(function () { return ctx.resume(); });
  }
  function fail() { msg.textContent = 'Sound could not start here.'; go.textContent = 'Play the beat'; }
  function one(k, rate, gain) {
    var s = ctx.createBufferSource(); s.buffer = buf[k]; s.playbackRate.value = rate || 1;
    var g = ctx.createGain(); g.gain.value = gain; s.connect(g); g.connect(ctx.destination); s.start();
  }
  function clearLit() { spans.forEach(function (sp) { sp.el.classList.remove('lit'); }); }
  function frame() {
    if (!playing) return;
    var t = ctx.currentTime - t0, cur = null;
    hits.forEach(function (h) { if (h.t <= t + 0.01) cur = h; });
    clearLit();
    if (cur && t - cur.t < 0.18) cur.sp.el.classList.add('lit');
    raf = requestAnimationFrame(frame);

    if (src) { src.onended = null; try { src.stop(); } catch (e) {} src = null; }

    if (playing) { stop(); return; }
    msg.textContent = ''; go.textContent = '…';
    try {
      ready().then(function () {
        src = ctx.createBufferSource(); src.buffer = buf.beat; src.connect(ctx.destination);

    } catch (e) { fail(); }
  });
  document.getElementById('old').addEventListener('click', function () {
    try { ready().then(function () { one('thud' + (thud++ % 4 + 1), 1, 0.9); }).catch(fail); } catch (e) { fail(); }
  });
  document.getElementById('new').addEventListener('click', function () {
    // The muted mallet sounds on the chord's root; here D, the home of Hap's key.
    try { ready().then(function () { one('muted' + (muted++ % 3 + 1), Math.pow(2, 2 / 12), 0.9); }).catch(fail); } catch (e) { fail(); }
